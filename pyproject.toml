[tool.poetry]
name = "practicumhw2"
version = "0.1.0"
description = ""
authors = []

[tool.poetry.dependencies]
python = "^3.11"
python-dotenv = "^1.2.2"
setuptools = "<81"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.liccheck]
authorized_licenses = [
    # Full names
    "bsd",
    "new bsd",
    "bsd license",
    "simplified bsd",
    "apache",
    "apache 2.0",
    "apache software",
    "apache software license",
    "apache license 2.0",
    "isc",
    "isc license (iscl)",
    "mit",
    "mit license",
    "mozilla public license 2.0 (mpl 2.0)",
    "python software foundation license",
    "python software foundation",
    "psfl",
    "lgpl",
    "gnu lesser general public license",
    "gnu library or lesser general public license (lgpl)",
    "historical permission notice and disclaimer (hpnd)",
    "public domain",
    "unlicense",
    "artistic license",
    "zpl 2.1",
    # SPDX identifiers (used by newer packages)
    "bsd-2-clause",
    "bsd-3-clause",
    "apache-2.0",
    "mit-cmu",
    "3-clause bsd",
    "mpl-2.0",
    # Compound SPDX expression reported by greenlet
    "mit and psf-2.0",
    # Bare "Artistic" (strip_license removes the trailing " License" suffix)
    "artistic",
]
unauthorized_licenses = [
    "gnu general public license",
    "gnu affero general public license",
]

[tool.liccheck.authorized_packages]
# text-unidecode is dual-licensed Artistic OR GPL; it is a transitive
# test-only dependency (pytest-playwright → python-slugify → text-unidecode).
# The Artistic license is permissive; whitelisting by name avoids a false
# GPL positive from the compound license declaration.
text-unidecode = ">=0.0.0"

[dependency-groups]
dev = [
    "pip-licenses (>=5.5.5,<6.0.0)"
]
